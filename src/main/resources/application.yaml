spring:
  application:
    name: umc-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}

tmdb:
  base-url: ${TMDB_BASE_URL}
  access-token: ${TMDB_ACCESS_TOKEN}

jwt:
  secret: ${JWT_SECRET} # 서명에 쓸 비밀키 (32자 이상)
  access-expiration: ${JWT_ACCESS_EXPIRATION} # 토큰 유효시간(초)
